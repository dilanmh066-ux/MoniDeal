<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F3826">
    <title>Rutas | Monideal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="vista-rutas">

<header class="ml-header">
    <div class="ml-header__contenido">
        <a class="ml-logo" th:href="@{/rutas}">
            <span class="ml-logo__icono" aria-hidden="true">🌿</span>
            Monideal
        </a>
        <nav class="ml-nav" aria-label="Pantallas del personal">
            <a th:href="@{/caja}">Caja</a>
            <a th:href="@{/rutas}" class="activo">Rutas</a>
            <a th:href="@{/historial}">Historial</a>
        </nav>
    </div>
</header>

<main class="contenedor">

    <nav class="migas" aria-label="Ruta de navegación">
        <a th:href="@{/rutas}">Inicio</a><span>/</span><span class="migas__actual">Mis rutas (Buga)</span>
    </nav>

    <div class="titulo-pagina">
        <div class="fila-titulo">
            <h1>Por entregar <span class="contador" id="contador" th:text="${#lists.size(pedidos)}">0</span></h1>
            <span class="en-vivo" id="estadoConexion">En vivo</span>
        </div>
        <p class="subtitulo">Entregas activas en Guadalajara de Buga. Revisa si debes cobrar efectivo o si ya está transferido.</p>
    </div>

    <section class="grid-pedidos" id="listaPedidos" aria-live="polite">
        <th:block th:each="p : ${pedidos}">
            <article th:replace="~{this :: tarjetaRuta(${p})}"></article>
        </th:block>
    </section>

    <div class="vacio" id="vacio" th:hidden="${!#lists.isEmpty(pedidos)}">
        <div class="vacio__icono" aria-hidden="true">🛵</div>
        <h2>No tienes entregas pendientes</h2>
        <p>Cuando caja despache un pedido, aparecerá aquí inmediatamente con su mapa y datos.</p>
    </div>
</main>

<!-- Plantilla de UNA tarjeta de ruta -->
<template id="tplRuta">
    <article class="pedido" th:fragment="tarjetaRuta(p)" th:data-id="${p?.idPedido}">
        <div class="pedido__cabecera">
            <span class="pedido__numero">Pedido #<span data-f="idPedido" th:text="${p?.idPedido}"></span></span>
            <div class="badges-cabecera">
                <span class="badge" data-f="badgeCobro"
                      th:classappend="${p?.metodoPago == 'TRANSFERENCIA' ? 'badge--pago-confirmado' : 'badge--efectivo'}"
                      th:text="${p?.metodoPago == 'TRANSFERENCIA' ? '🟢 Ya pagó (Transferencia)' : '💵 Cobrar en efectivo'}">
                </span>
                <span class="badge badge--ruta">En ruta</span>
            </div>
        </div>

        <div class="pedido__cuerpo">
            <!-- Dirección prioritaria para el domiciliario -->
            <div>
                <h3 class="pedido__direccion" data-f="direccion" th:text="${p?.direccion}"></h3>
                <p class="pedido__barrio">Barrio <span data-f="barrio" th:text="${p?.barrio}"></span> · Guadalajara de Buga</p>
            </div>

            <!-- Instrucción de cobro clara -->
            <div class="cobro-domiciliario" data-f="cobroAviso">
                <span th:if="${p?.metodoPago == 'TRANSFERENCIA'}" class="alerta-pago-verde">
                    ✅ <strong>NO COBRAR:</strong> Pagado previamente por transferencia.
                </span>
                <span th:if="${p?.metodoPago != 'TRANSFERENCIA'}" class="alerta-cobro-efectivo">
                    💵 <strong>COBRAR EN EFECTIVO AL ENTREGAR</strong>
                    <span th:if="${p?.pagaCon != null and !p?.pagaCon.isEmpty()}" th:text="'— Cliente tiene: ' + ${p.pagaCon}"></span>
                </span>
            </div>

            <div class="dato">
                <span class="dato__icono" aria-hidden="true">👤</span>
                <div class="dato__valor">
                    <strong data-f="clienteNombre" th:text="${p?.clienteNombre}"></strong>
                    <span data-f="clienteTelefono" th:text="${p?.clienteTelefono}"></span>
                </div>
            </div>

            <div class="pedido__resumen-carga">
                <span class="carga-icono">📦</span>
                <span data-f="producto" th:text="${p?.producto}"></span>
            </div>

            <p class="pedido__indicaciones" data-f="indicaciones"
               th:text="${p?.indicaciones}" th:hidden="${p == null or p.indicaciones == null}"></p>
        </div>

        <div class="pedido__acciones">
            <div class="acciones-secundarias">
                <!-- Enlace forzado a Guadalajara de Buga -->
                <a class="btn btn--secundario" data-enlace="mapa" target="_blank" rel="noopener"
                   th:href="${p != null ? 'https://www.google.com/maps/search/?api=1&query=' + #uris.escapeQueryParam(p.direccion + ', Barrio ' + p.barrio + ', Guadalajara de Buga, Valle del Cauca, Colombia') : '#'}">
                    🗺️ Cómo llegar (Buga)
                </a>
                <a class="btn btn--secundario" data-enlace="llamar"
                   th:href="${p != null ? 'tel:' + p.clienteTelefono : '#'}">
                    📞 Llamar
                </a>
            </div>
            <button type="button" class="btn btn--exito btn--bloque btn--grande" data-accion="entregar">
                ✓ Confirmar Entrega
            </button>
        </div>
    </article>
</template>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
    "use strict";

    const API_LISTAR = "/api/pedidos?estado=EN_RUTA";
    const API_ENTREGAR = id => `/api/pedidos/${id}/entregado`;
    const INTERVALO_MS = 8000;

    const lista = document.getElementById("listaPedidos");
    const plantilla = document.getElementById("tplRuta");
    const contador = document.getElementById("contador");
    const vacio = document.getElementById("vacio");
    const estadoConexion = document.getElementById("estadoConexion");

    let temporizador = null;
    const enProceso = new Set();

    function toast(mensaje, tipo = "info") {
        const el = document.createElement("div");
        el.className = `toast toast--${tipo}`;
        el.textContent = mensaje;
        document.getElementById("toasts").appendChild(el);
        setTimeout(() => el.remove(), 4000);
    }

    function vibrar() {
        if (navigator.vibrate) navigator.vibrate(120);
    }

    function tarjetas() {
        return Array.from(lista.querySelectorAll(".pedido"));
    }

    // Configurar enlace Google Maps asegurando Buga
    function urlMapaBuga(direccion, barrio) {
        const query = encodeURIComponent(`${direccion}, Barrio ${barrio}, Guadalajara de Buga, Valle del Cauca, Colombia`);
        return `https://www.google.com/maps/search/?api=1&query=${query}`;
    }

    function crearTarjeta(p) {
        const card = plantilla.content.firstElementChild.cloneNode(true);
        card.dataset.id = p.idPedido;

        card.querySelectorAll("[data-f]").forEach(el => {
            const campo = el.dataset.f;
            if (campo === "badgeCobro" || campo === "cobroAviso") return;
            el.textContent = p[campo] ?? "";
        });

        // Configurar Cobro
        const badgeCobro = card.querySelector('[data-f="badgeCobro"]');
        const cobroAviso = card.querySelector('[data-f="cobroAviso"]');
        const esTransf = p.metodoPago === "TRANSFERENCIA";

        if (esTransf) {
            badgeCobro.className = "badge badge--pago-confirmado";
            badgeCobro.textContent = "🟢 Ya pagó (Transferencia)";
            cobroAviso.innerHTML = '<span class="alerta-pago-verde">✅ <strong>NO COBRAR:</strong> Pagado previamente por transferencia.</span>';
        } else {
            badgeCobro.className = "badge badge--efectivo";
            badgeCobro.textContent = "💵 Cobrar en efectivo";
            const cambio = p.pagaCon ? ` — Cliente tiene: ${p.pagaCon}` : "";
            cobroAviso.innerHTML = `<span class="alerta-cobro-efectivo">💵 <strong>COBRAR EN EFECTIVO AL ENTREGAR</strong>${cambio}</span>`;
        }

        card.querySelector('[data-f="indicaciones"]').hidden = !p.indicaciones;

        card.querySelector('[data-enlace="mapa"]').href = urlMapaBuga(p.direccion, p.barrio);
        card.querySelector('[data-enlace="llamar"]').href = `tel:${p.clienteTelefono}`;

        card.classList.add("pedido--nuevo");
        return card;
    }

    function refrescarVista() {
        const todas = tarjetas().filter(c => !c.classList.contains("pedido--saliendo"));
        contador.textContent = todas.length;
        vacio.hidden = todas.length > 0;
    }

    function quitarTarjeta(card) {
        card.classList.add("pedido--saliendo");
        setTimeout(() => { card.remove(); refrescarVista(); }, 300);
    }

    function sincronizar(pedidos) {
        const idsServidor = new Set(pedidos.map(p => String(p.idPedido)));
        const enPantalla = new Map(tarjetas().map(c => [c.dataset.id, c]));
        let nuevos = 0;

        enPantalla.forEach((card, id) => {
            if (!idsServidor.has(id) && !enProceso.has(id) && !card.classList.contains("pedido--saliendo")) {
                quitarTarjeta(card);
            }
        });

        pedidos.forEach(p => {
            if (!enPantalla.has(String(p.idPedido))) {
                lista.appendChild(crearTarjeta(p));
                nuevos++;
            }
        });

        if (nuevos > 0) {
            vibrar();
            toast(nuevos === 1 ? "🛵 Nueva ruta asignada" : `🛵 ${nuevos} nuevas rutas asignadas`, "info");
        }
        refrescarVista();
    }

    async function consultar() {
        clearTimeout(temporizador);
        try {
            const resp = await fetch(API_LISTAR, { headers: { "Accept": "application/json" }, cache: "no-store" });
            if (!resp.ok) throw new Error(resp.status);
            sincronizar(await resp.json());
            estadoConexion.classList.remove("sin-conexion");
            estadoConexion.textContent = "En vivo";
        } catch (_) {
            estadoConexion.classList.add("sin-conexion");
            estadoConexion.textContent = "Sin conexión";
        } finally {
            if (!document.hidden) temporizador = setTimeout(consultar, INTERVALO_MS);
        }
    }

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) consultar();
        else clearTimeout(temporizador);
    });

    lista.addEventListener("click", async e => {
        const btn = e.target.closest('[data-accion="entregar"]');
        if (!btn) return;

        const card = btn.closest(".pedido");
        const id = card.dataset.id;
        if (enProceso.has(id)) return;

        const confirmar = confirm(`¿Confirmar que el Pedido #${id} ya fue entregado al cliente?`);
        if (!confirmar) return;

        enProceso.add(id);
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Guardando...';

        try {
            const resp = await fetch(API_ENTREGAR(id), { method: "PUT", headers: { "Accept": "application/json" } });
            const data = await resp.json().catch(() => ({}));

            if (resp.ok) {
                toast(`Pedido #${id} marcado como ENTREGADO y guardado en Historial`, "exito");
                vibrar();
                quitarTarjeta(card);
            } else {
                throw new Error(data.mensaje);
            }
        } catch (err) {
            toast(err.message || "No se pudo confirmar la entrega.", "error");
            btn.disabled = false;
            btn.textContent = "✓ Confirmar Entrega";
        } finally {
            enProceso.delete(id);
        }
    });

    tarjetas().forEach(c => c.classList.remove("pedido--nuevo"));
    refrescarVista();
    temporizador = setTimeout(consultar, INTERVALO_MS);
})();
</script>
</body>
</html>
